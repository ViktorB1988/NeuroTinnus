<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroTinnus</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Theme variables ─────────────────────────────────────────────────────── */
body.theme-a{
  --bg:#0b0e1a;--card:#111527;--border:#1e2540;
  --topbar:#111527;--topbar-border:#1e2540;--topbar-text:#e8eaf6;
  --primary:#7986cb;--primary-dark:#3949ab;
  --btn-bg:#1a1f3a;--btn-hover:#252c4a;
  --label:#5c6bc0;--text:#e8eaf6;--muted:#3d4a7a;
  --track:#1e2540;--playing:#1a1f3a;--divider:#1e2540;
  --freq:#7986cb;--freq-em:#5c6bc0;
  --dot-done:#3949ab;--status:#7986cb;
}
body.theme-b{
  --bg:#faf8f5;--card:#fff;--border:#e8e0d4;
  --topbar:#fff;--topbar-border:#e8e0d4;--topbar-text:#2c1810;
  --primary:#c4914a;--primary-dark:#8b4513;
  --btn-bg:#fdf5ec;--btn-hover:#f5e8d4;
  --label:#c4914a;--text:#2c1810;--muted:#c4a882;
  --track:#f0e8dc;--playing:#fdf5ec;--divider:#e8e0d4;
  --freq:#8b4513;--freq-em:#c4a882;
  --dot-done:#c4a882;--status:#8b4513;
}
body.theme-c{
  --bg:#f2faf8;--card:#fff;--border:#b2ddd6;
  --topbar:#0d4a3e;--topbar-border:#0d4a3e;--topbar-text:#e0f5f0;
  --primary:#1d8a74;--primary-dark:#0d4a3e;
  --btn-bg:#e0f5f0;--btn-hover:#b2ddd6;
  --label:#1d8a74;--text:#0d4a3e;--muted:#7ab8b0;
  --track:#d4ede9;--playing:#e0f5f0;--divider:#b2ddd6;
  --freq:#0d4a3e;--freq-em:#7ab8b0;
  --dot-done:#7ab8b0;--status:#1d8a74;
}
/* ── Base ────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Figtree',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;transition:background 0.25s}
.topbar{width:100%;background:var(--topbar);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--topbar-border);position:sticky;top:0;z-index:10;transition:background 0.25s,border-color 0.25s}
.topbar h1{font-size:17px;font-weight:600;color:var(--topbar-text);letter-spacing:-0.2px;transition:color 0.25s}
.theme-switcher{display:flex;gap:7px;align-items:center}
.theme-dot{width:17px;height:17px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform 0.12s,box-shadow 0.15s;outline:none;flex-shrink:0}
.theme-dot:hover{transform:scale(1.2)}
.theme-dot.active{box-shadow:0 0 0 2.5px var(--topbar-text)}
.content{width:100%;max-width:420px;padding:18px 16px 52px;display:flex;flex-direction:column;gap:13px}
.section-label{font-size:10px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:0.8px;padding:0 4px;transition:color 0.25s}
.card{background:var(--card);border-radius:18px;padding:15px 16px;border:0.5px solid var(--border);transition:background 0.25s,border-color 0.25s}
.freq-display{font-size:22px;font-weight:600;color:var(--freq);text-align:center;margin-bottom:13px;letter-spacing:-0.5px;transition:color 0.25s}
.freq-display em{font-size:14px;font-weight:400;color:var(--freq-em);font-style:normal;transition:color 0.25s}
.slider-wrap{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;outline:none;cursor:pointer;transition:background 0.25s}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;transition:background 0.25s}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--primary);cursor:pointer;border:none;transition:background 0.25s}
.therapy-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-radius:10px;transition:background 0.2s}
.therapy-row.playing{background:var(--playing)}
.therapy-num{font-size:13px;font-weight:500;color:var(--label);width:16px;text-align:center;flex-shrink:0;transition:color 0.25s}
.therapy-freq{font-size:11px;color:var(--muted);min-width:58px;text-align:right;flex-shrink:0;transition:color 0.25s}
.divider{height:0.5px;background:var(--divider);margin:0 4px;transition:background 0.25s}
.vol-row{display:flex;align-items:center;gap:8px}
.vol-label{font-size:12px;color:var(--text);font-weight:500;white-space:nowrap;transition:color 0.25s}
.vol-val{font-size:12px;color:var(--muted);min-width:30px;text-align:right;transition:color 0.25s}
.check-row{display:flex;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:0.5px solid var(--divider)}
.check-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
.check-row label{font-size:13px;color:var(--text);font-weight:500;cursor:pointer;user-select:none;transition:color 0.25s}
.waveform-row{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:0.5px solid var(--divider)}
.waveform-label{font-size:12px;color:var(--text);font-weight:500;white-space:nowrap;transition:color 0.25s}
.waveform-btns{display:flex;gap:5px;flex-wrap:wrap}
.wf-btn{padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;color:var(--label);cursor:pointer;transition:all 0.15s}
.wf-btn:hover{border-color:var(--primary);color:var(--primary)}
.wf-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.noise-header{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.noise-type-btns{display:flex;gap:5px}
.noise-btn{padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-family:'Figtree',sans-serif;font-size:12px;font-weight:500;color:var(--label);cursor:pointer;transition:all 0.15s}
.noise-btn:hover{border-color:var(--primary);color:var(--primary)}
.noise-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.main-wrap{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:9px;width:100%}
.main-label{font-size:12px;color:var(--muted);font-weight:500;transition:color 0.25s}
.seq-track{display:flex;gap:5px;justify-content:center;min-height:14px;flex-wrap:wrap;max-width:260px}
.seq-dot{width:13px;height:13px;border-radius:50%;background:var(--track);transition:background 0.12s;flex-shrink:0}
.seq-dot.done{background:var(--dot-done)}
.seq-dot.current{background:var(--primary)}
.status{font-size:11px;color:var(--status);text-align:center;min-height:16px;font-weight:500;transition:color 0.25s}
</style>
</head>
<body class="theme-c">

<div class="topbar">
  <h1>NeuroTinnus</h1>
  <div class="theme-switcher" aria-label="Choose colour theme">
    <button class="theme-dot" data-theme="theme-a" style="background:#7986cb" aria-label="Deep space theme" title="Deep space"></button>
    <button class="theme-dot" data-theme="theme-b" style="background:#c4914a" aria-label="Warm clinical theme" title="Warm clinical"></button>
    <button class="theme-dot active" data-theme="theme-c" style="background:#1d8a74" aria-label="High contrast teal theme" title="High contrast teal"></button>
  </div>
</div>

<div class="content">

  <div class="card">
    <div class="vol-row">
      <span class="vol-label">Therapy sounds volume</span>
      <div class="slider-wrap" style="flex:1">
        <input type="range" id="master-vol" min="0" max="100" step="1" value="80">
      </div>
      <span class="vol-val" id="mvlbl">80%</span>
    </div>
  </div>

  <div class="section-label">My Tinnitus Settings</div>
  <div class="card">
    <div class="freq-display" id="freq-display">2660&nbsp;<em>Hz</em></div>
    <div class="slider-wrap">
      <input type="range" id="tinnitus-slider" min="100" max="12000" step="10" value="2660">
      <div id="prev-wrap"></div>
    </div>
  </div>

  <div class="section-label">Therapy Tones Volume</div>
  <div class="card">
    <div id="therapy-rows"></div>
    <div class="check-row">
      <input type="checkbox" id="rand-vol">
      <label for="rand-vol">Randomize volume</label>
    </div>
    <div class="waveform-row">
      <span class="waveform-label">Waveform</span>
      <div class="waveform-btns">
        <button class="wf-btn active" data-wave="sine">Sine</button>
        <button class="wf-btn" data-wave="triangle">Triangle</button>
        <button class="wf-btn" data-wave="sawtooth">Sawtooth</button>
        <button class="wf-btn" data-wave="square">Square</button>
      </div>
    </div>
    <div class="check-row" style="margin-top:9px;padding-top:9px">
      <input type="checkbox" id="rand-wave">
      <label for="rand-wave">Randomize waveform</label>
    </div>
  </div>

  <div class="main-wrap">
    <div id="main-wrap-btn"></div>
    <div class="main-label" id="main-label">Play Therapy</div>
    <div class="seq-track" id="seq-track"></div>
    <div class="status" id="status"></div>
  </div>

  <div class="section-label">Background Noise</div>
  <div class="card">
    <div class="noise-header">
      <div id="noise-btn-wrap"></div>
      <div class="noise-type-btns">
        <button class="noise-btn active" data-noise="white">White</button>
        <button class="noise-btn" data-noise="pink">Pink</button>
        <button class="noise-btn" data-noise="brown">Brown</button>
      </div>
    </div>
    <div class="vol-row">
      <span class="vol-label">Volume</span>
      <div class="slider-wrap" style="flex:1">
        <input type="range" id="noise-vol" min="0" max="100" step="1" value="50">
      </div>
      <span class="vol-val" id="noise-vol-lbl">50%</span>
    </div>
    <div class="vol-row" style="margin-top:10px">
      <span class="vol-label">Frequency</span>
      <div class="slider-wrap" style="flex:1">
        <input type="range" id="noise-freq-sl" min="100" max="12000" step="10" value="1000">
      </div>
      <span class="vol-val" id="noise-freq-lbl">1 kHz</span>
    </div>
  </div>

</div>

<script>
// ── Button factory ─────────────────────────────────────────────────────────
function mkBtn(sz, br) {
  const b = document.createElement('button');
  b.style.cssText = `width:${sz}px;height:${sz}px;min-width:${sz}px;border-radius:${br}px;` +
    `border:2.5px solid var(--primary);background:var(--btn-bg);` +
    `display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex-shrink:0;transition:background 0.15s`;
  const ic = Math.round(sz * 0.44);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 32 32');
  svg.style.cssText = `width:${ic}px;height:${ic}px;display:block;color:var(--primary);transition:color 0.15s`;
  b.appendChild(svg);
  let on = false;
  function activate(v) {
    on = v;
    b.style.background = v ? 'var(--primary)' : 'var(--btn-bg)';
    svg.style.color     = v ? '#fff' : 'var(--primary)';
    svg.innerHTML = v
      ? '<rect x="6" y="5" width="7" height="22" fill="currentColor"/><rect x="19" y="5" width="7" height="22" fill="currentColor"/>'
      : '<polygon points="9,6 25,16 9,26" fill="currentColor"/>';
  }
  activate(false);
  b.addEventListener('mouseover', () => { if (!on) b.style.background = 'var(--btn-hover)'; });
  b.addEventListener('mouseout',  () => { if (!on) b.style.background = 'var(--btn-bg)'; });
  return { b, activate };
}

const { b: prevBtn,  activate: setPrev  } = mkBtn(36, 50);
const { b: mainBtn,  activate: setMain  } = mkBtn(72, 20);
const { b: noiseBtn, activate: setNoise } = mkBtn(36, 50);
document.getElementById('prev-wrap').appendChild(prevBtn);
document.getElementById('main-wrap-btn').appendChild(mainBtn);
document.getElementById('noise-btn-wrap').appendChild(noiseBtn);

// ── Theme switcher ─────────────────────────────────────────────────────────
document.querySelectorAll('.theme-dot').forEach(dot => {
  dot.addEventListener('click', () => {
    document.body.className = dot.dataset.theme;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
  });
});

// ── Audio ──────────────────────────────────────────────────────────────────
const AC = window.AudioContext || window.webkitAudioContext;
let ctx = null, masterGainNode = null, masterVol = 0.8;
let currentWaveform = 'sine', seqWaveform = 'sine';

function initAudio() {
  if (!ctx) ctx = new AC();
  if (ctx.state === 'suspended') ctx.resume();
  if (!masterGainNode) {
    masterGainNode = ctx.createGain();
    masterGainNode.gain.value = masterVol;
    masterGainNode.connect(ctx.destination);
  }
}

// ── App state ──────────────────────────────────────────────────────────────
let tinnitusHz = 2660;
let volValues = [0.65, 0.65, 0.35, 0.35];
let previewPlaying = false, previewOsc = null;
let therapyPlaying = false, therapyTimer = null;
let currentSeq = [], seqLen = 10, seqPos = 0;
let currentOsc = null, currentOscGain = null;

const TONE_DUR = 300;
const OFFSETS  = [-1000, -430, 850, 1670];
const OFF_L    = ['−1000 Hz', '−430 Hz', '+850 Hz', '+1670 Hz'];

function rnd(a, b)    { return Math.random() * (b - a) + a; }
function rndInt(a, b) { return Math.floor(rnd(a, b + 1)); }
function randSeqLen() { return rndInt(4, 15); }
function randPause()  { return rnd(700, 1500); }
function randSeq(len, last) {
  const s = []; let p = (last !== undefined) ? last : -1;
  for (let i = 0; i < len; i++) { let n; do { n = rndInt(0, 3); } while (n === p); s.push(n); p = n; }
  return s;
}
function fmtHz(hz) {
  return hz >= 1000 ? (hz / 1000).toFixed(2).replace(/\.?0+$/, '') + ' kHz' : Math.round(hz) + ' Hz';
}
function tFreqs() { return OFFSETS.map(o => Math.max(20, Math.min(20000, tinnitusHz + o))); }

function setTrack(el, pct, col, bg) {
  el.style.background = `linear-gradient(to right, ${col} ${pct}%, ${bg} ${pct}%)`;
}
const P = 'var(--primary)', T = 'var(--track)'; // shorthand for track calls

// ── Master volume ──────────────────────────────────────────────────────────
const mvSl = document.getElementById('master-vol');
setTrack(mvSl, 80, P, T);
mvSl.addEventListener('input', () => {
  masterVol = mvSl.value / 100;
  document.getElementById('mvlbl').textContent = mvSl.value + '%';
  setTrack(mvSl, mvSl.value, P, T);
  if (masterGainNode) masterGainNode.gain.setTargetAtTime(masterVol, ctx.currentTime, 0.015);
});

// ── Tinnitus slider ────────────────────────────────────────────────────────
const tSl   = document.getElementById('tinnitus-slider');
const fDisp = document.getElementById('freq-display');
function updFreq() {
  const f = tinnitusHz;
  fDisp.innerHTML = f >= 1000
    ? (f / 1000).toFixed(2).replace(/\.?0+$/, '') + '&nbsp;<em>kHz</em>'
    : f + '&nbsp;<em>Hz</em>';
  setTrack(tSl, ((f - 100) / (12000 - 100) * 100).toFixed(2), P, T);
  tFreqs().forEach((freq, i) => { const el = document.getElementById('tl' + i); if (el) el.textContent = fmtHz(freq); });
}
updFreq();
tSl.addEventListener('input', () => {
  tinnitusHz = parseInt(tSl.value); updFreq();
  if (previewPlaying && previewOsc) previewOsc.frequency.setTargetAtTime(tinnitusHz, ctx.currentTime, 0.03);
});

// ── Waveform selector ──────────────────────────────────────────────────────
document.querySelectorAll('.wf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentWaveform = btn.dataset.wave;
    document.querySelectorAll('.wf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (previewPlaying && previewOsc) previewOsc.type = currentWaveform;
  });
});

// ── Therapy rows ───────────────────────────────────────────────────────────
const rowsEl = document.getElementById('therapy-rows');
const rowEls = [];
OFF_L.forEach((lbl, i) => {
  if (i > 0) { const d = document.createElement('div'); d.className = 'divider'; rowsEl.appendChild(d); }
  const row = document.createElement('div'); row.className = 'therapy-row';
  row.innerHTML = `<span class="therapy-num">${i+1}</span><input type="range" min="0" max="100" step="1" value="${Math.round(volValues[i]*100)}" style="flex:1"><span class="therapy-freq" id="tl${i}"></span>`;
  rowsEl.appendChild(row);
  const vsl = row.querySelector('input');
  setTrack(vsl, Math.round(volValues[i]*100), P, T);
  vsl.addEventListener('input', () => {
    volValues[i] = vsl.value / 100; setTrack(vsl, vsl.value, P, T);
    if (currentOscGain && therapyPlaying && seqPos > 0 && currentSeq[seqPos-1] === i)
      currentOscGain.gain.setTargetAtTime(volValues[i], ctx.currentTime, 0.015);
  });
  rowEls.push(row);
});
function setActiveRow(idx) { rowEls.forEach((r, i) => r.classList.toggle('playing', i === idx)); }
function clearRows() { rowEls.forEach(r => r.classList.remove('playing')); }

// ── Dots ───────────────────────────────────────────────────────────────────
const seqEl = document.getElementById('seq-track');
let dots = [];
function buildDots(n) {
  seqEl.innerHTML = ''; dots = [];
  for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'seq-dot'; seqEl.appendChild(d); dots.push(d); }
}
function updDots(pos, pausing) {
  dots.forEach((d, i) => {
    d.classList.remove('current','done');
    if (pausing) d.classList.add('done');
    else if (i < pos) d.classList.add('done');
    else if (i === pos) d.classList.add('current');
  });
}

// ── Preview ────────────────────────────────────────────────────────────────
prevBtn.addEventListener('click', () => {
  if (previewPlaying) {
    previewOsc.stop(); previewOsc = null;
    previewPlaying = false; setPrev(false);
    document.getElementById('status').textContent = '';
  } else {
    stopTherapy(); initAudio();
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = currentWaveform; osc.frequency.value = tinnitusHz; g.gain.value = 0.3;
    osc.connect(g); g.connect(masterGainNode); osc.start();
    previewOsc = osc; previewPlaying = true; setPrev(true);
    document.getElementById('status').textContent = 'Previewing tinnitus tone';
  }
});

// ── Therapy ────────────────────────────────────────────────────────────────
function stopTherapy() {
  if (therapyTimer) { clearTimeout(therapyTimer); therapyTimer = null; }
  if (currentOsc) { try { currentOsc.stop(); } catch(e){} currentOsc = null; }
  currentOscGain = null; therapyPlaying = false; seqPos = 0; currentSeq = [];
  clearRows(); seqEl.innerHTML = ''; dots = []; setMain(false);
  document.getElementById('main-label').textContent = 'Play Therapy';
  document.getElementById('status').textContent = '';
  document.querySelectorAll('.wf-btn').forEach(b => b.classList.toggle('active', b.dataset.wave === currentWaveform));
}

function playNext() {
  if (!therapyPlaying) return;
  if (currentOsc) { try { currentOsc.stop(); } catch(e){} currentOsc = null; currentOscGain = null; }
  if (seqPos >= seqLen) {
    clearRows(); updDots(seqPos, true);
    document.getElementById('status').textContent = 'Pause…';
    const last = currentSeq[seqLen - 1];
    therapyTimer = setTimeout(() => {
      if (!therapyPlaying) return;
      seqLen = randSeqLen(); currentSeq = randSeq(seqLen, last); seqPos = 0; buildDots(seqLen);
      const WF = ['sine','triangle','sawtooth','square'];
      if (document.getElementById('rand-wave').checked) seqWaveform = WF[Math.floor(Math.random()*WF.length)];
      playNext();
    }, randPause());
    return;
  }
  const idx = currentSeq[seqPos], freqs = tFreqs();
  const isRand = document.getElementById('rand-vol').checked;
  const toneGainVal = volValues[idx] * (isRand ? Math.random() : 1.0);
  const WF = ['sine','triangle','sawtooth','square'];
  const waveform = document.getElementById('rand-wave').checked ? seqWaveform : currentWaveform;
  document.querySelectorAll('.wf-btn').forEach(b => b.classList.toggle('active', b.dataset.wave === waveform));
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = waveform; osc.frequency.value = freqs[idx]; g.gain.value = toneGainVal;
  osc.connect(g); g.connect(masterGainNode); osc.start();
  currentOsc = osc; currentOscGain = g;
  setActiveRow(idx); updDots(seqPos, false);
  const volPct = Math.round(toneGainVal * 100);
  document.getElementById('status').textContent =
    'Tone ' + (seqPos+1) + '/' + seqLen + ' — ' + fmtHz(freqs[idx]) + (isRand ? '  [vol: '+volPct+'%]' : '');
  seqPos++; therapyTimer = setTimeout(playNext, TONE_DUR);
}

mainBtn.addEventListener('click', () => {
  if (therapyPlaying) { stopTherapy(); }
  else {
    if (previewPlaying) { previewOsc.stop(); previewOsc = null; previewPlaying = false; setPrev(false); }
    initAudio(); therapyPlaying = true;
    seqLen = randSeqLen(); currentSeq = randSeq(seqLen); seqPos = 0;
    const WF = ['sine','triangle','sawtooth','square'];
    seqWaveform = document.getElementById('rand-wave').checked
      ? WF[Math.floor(Math.random()*WF.length)] : currentWaveform;
    buildDots(seqLen); setMain(true);
    document.getElementById('main-label').textContent = 'Stop Therapy';
    playNext();
  }
});

// ── Background noise ───────────────────────────────────────────────────────
let noiseType = 'white', noisePlaying = false;
let noiseSource = null, noiseFilter = null, noiseGainNode = null;
let noiseVol = 0.5, noiseFreqHz = 1000;

function buildNoiseBuffer(type) {
  const rate = ctx.sampleRate, size = rate * 2;
  const buf = ctx.createBuffer(1, size, rate), d = buf.getChannelData(0);
  if (type === 'white') {
    for (let i = 0; i < size; i++) d[i] = Math.random() * 2 - 1;
  } else if (type === 'pink') {
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < size; i++) {
      const w = Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)/4; b6=w*0.115926;
    }
  } else {
    let last=0;
    for (let i=0;i<size;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  }
  return buf;
}

function startNoise() {
  initAudio();
  const src = ctx.createBufferSource(); src.buffer = buildNoiseBuffer(noiseType); src.loop = true;
  const filt = ctx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=noiseFreqHz; filt.Q.value=0.8;
  const gain = ctx.createGain(); gain.gain.value = noiseVol;
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  src.start();
  noiseSource=src; noiseFilter=filt; noiseGainNode=gain;
  noisePlaying=true; setNoise(true);
}
function stopNoise() {
  if (noiseSource){try{noiseSource.stop();}catch(e){}noiseSource=null;}
  noiseFilter=null; noiseGainNode=null; noisePlaying=false; setNoise(false);
}
noiseBtn.addEventListener('click', () => { if (noisePlaying) stopNoise(); else startNoise(); });
document.querySelectorAll('.noise-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    noiseType = btn.dataset.noise;
    document.querySelectorAll('.noise-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (noisePlaying) { stopNoise(); startNoise(); }
  });
});

const noiseVolSl = document.getElementById('noise-vol');
setTrack(noiseVolSl, 50, P, T);
noiseVolSl.addEventListener('input', () => {
  noiseVol = noiseVolSl.value / 100;
  document.getElementById('noise-vol-lbl').textContent = noiseVolSl.value + '%';
  setTrack(noiseVolSl, noiseVolSl.value, P, T);
  if (noiseGainNode) noiseGainNode.gain.setTargetAtTime(noiseVol, ctx.currentTime, 0.015);
});

const noiseFreqSl = document.getElementById('noise-freq-sl');
setTrack(noiseFreqSl, ((1000-100)/(12000-100)*100).toFixed(2), P, T);
noiseFreqSl.addEventListener('input', () => {
  noiseFreqHz = parseInt(noiseFreqSl.value);
  document.getElementById('noise-freq-lbl').textContent = fmtHz(noiseFreqHz);
  setTrack(noiseFreqSl, ((noiseFreqHz-100)/(12000-100)*100).toFixed(2), P, T);
  if (noiseFilter) noiseFilter.frequency.setTargetAtTime(noiseFreqHz, ctx.currentTime, 0.02);
});
</script>
